<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>{shop_name}</title></head>
<body style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#333;background:#f5f5f5;padding:20px;">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;margin:0 auto;background:#fff;border-radius:6px;">
<tr><td style="padding:20px 24px;border-bottom:1px solid #eee;"><strong style="font-size:16px;">Mensaje desde el asistente de la tienda</strong></td></tr>
<tr><td style="padding:20px 24px;">
<p><strong>Nombre:</strong> {name}<br><strong>Email:</strong> {email}</p>
<p><strong>Mensaje:</strong><br>{message}</p>
<hr style="border:0;border-top:1px solid #eee;margin:20px 0;">
<p><strong>Conversación con el asistente:</strong></p>
<div style="background:#f8f8f8;padding:12px;border-radius:4px;color:#555;">{transcript}</div>
<p style="color:#888;font-size:12px;margin-top:20px;">Responde a este correo para contestar directamente al cliente. Conversación nº {conversation}.</p>
</td></tr>
</table>
</body></html>
